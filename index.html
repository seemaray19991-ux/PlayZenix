<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayZenix Gaming</title>
  <style>
    body {
      background: #101020;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }
    h1 { color: #00f5ff; font-size: 42px; }
    .game {
      background: #222244;
      padding: 20px;
      margin: 20px auto;
      border-radius: 15px;
      max-width: 320px;
    }
    button {
      background: #00e5ff;
      color: #101020;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🎮 PlayZenix</h1>
  <p>Welcome to your gaming world!</p>

  <div class="game">
    <h2>⚡ Quick Tap</h2>
    <p>Play mini-games and earn virtual coins!</p>
    <button onclick="alert('Welcome to PlayZenix!')">Start Game</button>
  </div>

  <p>Coins: <span id="coins">0</span> 🪙</p>
  <button onclick="document.getElementById('coins').textContent = Number(document.getElementById('coins').textContent) + 10">Earn 10 Coins</button>
</body>
</html>
